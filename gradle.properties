#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

VERSION=1.0.5

# Maven Central 发布文件数精简（需 maven-publish 插件 >= 0.37.0）：
# 只上传 md5/sha1 校验和；不为 .asc 签名文件生成校验和（Sonatype 官方明确不需要）。
# 用于规避 Central Portal 的 File Count 月度配额限制。
mavenCentralChecksums=md5,sha1
mavenCentralExcludeSignatureChecksums=true
